  <body>
    <!--
      THE MINI-FORM BOUNDARY, mirrored from the live DOM (M1.5 re-probe,
      2026-08-03; .superpowers/sdd/2026-08-02-m15-identity-amendment/m15-t6-live-capture.json
      records itemfieldsInMainForm: true, tableInsideMainForm: FALSE,
      tableInsideAnyForm: true). NetSuite wraps the machine table in its own
      mini-form — form[name="item_form"] — that does NOT contain the identity
      inputs, while itemfields/itemdata live in form[name="main_form"], which
      does NOT contain the table. table.closest("form") therefore reaches a form
      with no inputs in it, which is why every live install read an empty axis.

      This split is the whole point of the fixture: with the two forms separate
      and disjoint, the ONLY way to mount is the document-scoped resolution in
      src/edit-grid/runtime.js currentColumnIds. The pre-T6a fixture wired the
      inputs into the table's own ancestor form, so it asserted precisely what
      live contradicts. Do not merge these two forms back together.
    -->
    <form id="main_form" name="main_form">
      <input id="baserecordtype" type="hidden" value="salesorder">
      <!--
        The machine's own serialization of its field list and line values. These
        are the identity source (spec Amendment A1.2): form-determined,
        unprefixed and i18n-proof. Both are regenerated by buildTable() on every
        repaint, so add/insert/remove can never leave them disagreeing with the
        rendered rows. They start empty because the emulator below fills them:
        the runtime installs on every machine mutation, so an install that
        raced ahead of this document's own script finds no machine and declines,
        and the next one — scheduled by the very rows the script appends —
        succeeds.
      -->
      <input type="hidden" name="itemfields" id="itemfields" value="">
      <input type="hidden" name="itemdata" id="itemdata" value="">
      <main id="div__body">
        <h1 class="uir-page-title-firstline">Sales Order #SO10428 — Edit</h1>
      </main>
    </form>
    <form id="item_form" name="item_form">
      <div id="items" class="uir-machine-table-container" data-machine-name="item">
        <table id="item_splits" class="uir-machine-table">
          <tbody></tbody>
        </table>
      </div>
    </form>
    <script>
      // Emulates the item machine as the 2026-08-02 live pass actually observed
      // it (.superpowers/sdd/2026-08-02-edit-mode-table-enhancements/probe-transcripts.md).
      // The M1 shape is deliberately GONE: it gave static rows {machine}_{column}{n}_fs
      // spans and gave data rows one more cell than the header, and both were
      // falsified live (probe 2: 43 === 43 cells, SYMMETRIC; probe 4: zero _fs
      // spans, zero span[id], zero inputs on a static row — cells are bare text).
      // A fixture that keeps them passes where reality fails.
      (() => {
        // The machine's delimiters, written as code points: SOH separates
        // fields, STX separates lines, ENQ separates the options inside one
        // select field's value (spec Amendment A1.1 — ENQ is NOT a line break).
        const SOH = String.fromCharCode(1);
        const STX = String.fromCharCode(2);
        const ENQ = String.fromCharCode(5);

        // The first 25 ids of the live itemfields payload, verbatim from
        // m15-identity-payload.json and identical to LIVE_FIELDS in
        // tests/edit-grid.test.mjs. Twenty-five fields render as TWELVE columns:
        // three _display twins collapse onto their raw id, two ENQ option lists
        // are not columns at all, and eight more are carried by the payload and
        // never rendered. That gap is the whole point — the fixture exercises the
        // SELECTION problem, not a 1:1 list that would pass on any reader.
        const FIELDS = [
          "item_display", "item", "olditemid", "quantitycommitted", "quantitypickpackship",
          "quantityfulfilled", "quantitybilled", "quantitybackordered", "quantityavailable",
          "quantity", "olditemcount", "units_display", "units", "unitslist", "unitconversionrate",
          "description", "price_display", "price", "pricelevels", "custcol_rrp", "rate",
          "rateschedule", "marginal", "oqpbucket", "amount"
        ];

        // The twelve rendered columns: ids and labels verbatim from the live
        // pass (probe-transcripts.md:57). `source` is the field whose value the
        // machine RENDERS in that cell — the _display twin where one exists, the
        // raw id otherwise, which is exactly what collapseDisplayTwins() expects
        // to find corroborating the raw id it emits.
        const COLUMNS = [
          { id: "item", label: "Item", source: "item_display" },
          { id: "quantitycommitted", label: "Committed", source: "quantitycommitted" },
          { id: "quantityfulfilled", label: "Fulfilled", source: "quantityfulfilled" },
          { id: "quantitybilled", label: "Invoiced", source: "quantitybilled" },
          { id: "quantitybackordered", label: "Back Ordered", source: "quantitybackordered" },
          { id: "quantityavailable", label: "Available", source: "quantityavailable", grouped: true },
          { id: "quantity", label: "Quantity", source: "quantity" },
          { id: "units", label: "Units", source: "units_display" },
          { id: "description", label: "Description", source: "description" },
          { id: "price", label: "Price Level", source: "price_display" },
          { id: "custcol_rrp", label: "RRP", source: "custcol_rrp" },
          { id: "rate", label: "Unit Price", source: "rate" }
        ];

        // One line's 25 raw values. Every generated line keeps the live SHAPE —
        // the _display twins populated, unitslist and pricelevels carrying ENQ
        // option lists — because collapseDisplayTwins() drops a column only when
        // ENQ appears in it on SOME line: a synthetic line without ENQ would
        // silently re-admit unitslist and pricelevels as columns and change the
        // very axis this fixture exists to pin.
        function makeLine({ code, itemId, description, available, quantity, rate, amount }) {
          return {
            item_display: code,
            item: itemId,
            olditemid: itemId,
            quantitycommitted: "0",
            quantitypickpackship: "0",
            quantityfulfilled: "0",
            quantitybilled: "0",
            quantitybackordered: "",
            quantityavailable: available,
            quantity,
            olditemcount: "1",
            units_display: "Ea",
            units: "3",
            unitslist: `3${ENQ}4${ENQ}5`,
            unitconversionrate: "1",
            description,
            price_display: "Custom",
            price: "-1",
            pricelevels: `22${ENQ}50${ENQ}-1`,
            custcol_rrp: "",
            rate,
            rateschedule: "",
            marginal: "F",
            oqpbucket: "",
            amount
          };
        }

        // Real lines from the locked record, in record order. Lines 1 and 2 are
        // byte-identical to LIVE_LINE_1/LIVE_LINE_2 in tests/edit-grid.test.mjs;
        // the rest come from the same payload, so add-line and insert-line grow
        // the machine with live data rather than with invented values.
        const RECORDS = [
          { code: "MCH376", itemId: "4998", description: "Magic Makeup Blender with Hard Case", available: "82", quantity: "1", rate: "14.545", amount: "14.55" },
          { code: "MCH214", itemId: "1405", description: "Everyday 6 Piece Essentials Set", available: "1701", quantity: "1", rate: "30.909", amount: "30.91" },
          { code: "MCOL1675", itemId: "7396", description: "Smooth & Style Comb Duo Pack", available: "26", quantity: "1", rate: "9.091", amount: "9.09" },
          { code: "MCH14", itemId: "1328", description: "XtendLashMascara Black", available: "4586", quantity: "1", rate: "25.455", amount: "25.46" },
          { code: "MCH322", itemId: "3109", description: "Hair and Brow Magic Wand", available: "100", quantity: "1", rate: "13.636", amount: "13.64" },
          { code: "MCW503", itemId: "5611", description: "Miracle Flawless Pressed Powder 1 Light", available: "183", quantity: "1", rate: "25.455", amount: "25.46" },
          { code: "MCW618", itemId: "6324", description: "Perfect Pout Lip Liner - Ruby Rouge", available: "137", quantity: "1", rate: "12.727", amount: "12.73" },
          { code: "MCH578", itemId: "5909", description: "Glow Up PH Powder Blush Rosy Pink", available: "258", quantity: "1", rate: "21.818", amount: "21.82" },
          { code: "MCH246", itemId: "1449", description: "Instant Concealer Camouflage & Contour - Ivory", available: "143", quantity: "1", rate: "18.182", amount: "18.18" }
        ];

        // The permanent entry row renders a NEW line: blank everywhere the user
        // has not typed. It is never serialized into itemdata — NetSuite numbers
        // only its committed lines — so it exists purely to be rendered. `units`
        // keeps its list and default so the entry row's select has a pristine
        // selection to be measured against.
        const BLANK_LINE = {
          ...makeLine({
            code: "", itemId: "", description: "", available: "", quantity: "", rate: "", amount: ""
          }),
          quantitycommitted: "",
          quantitypickpackship: "",
          quantityfulfilled: "",
          quantitybilled: "",
          olditemcount: "",
          units_display: "",
          unitconversionrate: "",
          price_display: "",
          price: "",
          marginal: "",
          amount: ""
        };

        const table = document.querySelector("#item_splits");
        const fieldsInput = document.querySelector("#itemfields");
        const dataInput = document.querySelector("#itemdata");
        let lines = RECORDS.slice(0, 3).map(makeLine);
        // The machine's focus: a committed line number, or null for the
        // permanent entry row, which holds the focus whenever no line is open.
        let focusedLine = null;
        // Widgets materialize PER CELL, on the cell that was clicked (probe 11
        // and Gate A step c). The machine starts with the focused row's item
        // cell materialized — the pre-open entry row already carried
        // item_item_display live (probe-transcripts.md:33).
        let materialized = new Set(["item"]);

        function groupThousands(raw) {
          // Live rendered quantityavailable 1701 as "1,701": the rendered text
          // and the raw payload value differ by a separator, which is precisely
          // what core.textMatchesValue's numeric comparison exists to bridge.
          return /^[0-9]{4,}$/.test(raw) ? raw.replace(/\B(?=([0-9]{3})+$)/g, ",") : raw;
        }

        function renderText(line, column) {
          const raw = String(line[column.source] ?? "");
          return column.grouped ? groupThousands(raw) : raw;
        }

        function textCell(text) {
          // Bare text, nothing else. Probe 4: `<td>MCH376</td>` — no _fs span, no
          // span[id] at all, no input, on any of the 43 cells of a static row.
          const td = document.createElement("td");
          td.textContent = text;
          return td;
        }

        function textInput(id, value) {
          const input = document.createElement("input");
          input.type = "text";
          input.id = id;
          input.name = id;
          input.value = value;
          // defaultValue is the pristine state runtime.js fieldIsDirty() compares
          // against; leaving it unset would report every untouched widget dirty.
          input.defaultValue = value;
          return input;
        }

        function hiddenInput(id, value) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.id = id;
          input.name = id;
          input.value = value;
          input.defaultValue = value;
          return input;
        }

        function itemWidget(line) {
          // Live (probe-transcripts.md:33 and :36): the item widget's ids carry NO
          // line digits — item_item_display, hddn_item_item_fs, span item_item_fs
          // — and the same three ids appear whether the entry row or a numbered
          // line holds the focus. That is the shape columnIdFromSpanId's line-less
          // decode (Task 3) exists for.
          const span = document.createElement("span");
          span.id = "item_item_fs";
          span.append(
            textInput("item_item_display", line.item_display),
            hiddenInput("hddn_item_item_fs", line.item)
          );
          // The two action-button spans the live pass recorded in the same cell.
          // Kept because they make the cell HARDER to read, not easier: a reader
          // that trusts span[id$="_fs"] finds three spans here, not one.
          const actionParent = document.createElement("span");
          actionParent.id = "parent_actionbuttons_item_item_fs";
          const actions = document.createElement("span");
          actions.id = "actionbuttons_item_item_fs";
          actionParent.append(actions);
          span.append(actionParent);
          return span;
        }

        function unitsWidget(line) {
          // The one widget shape the live pass never recorded, and it is a
          // <select> deliberately: runtime.js fieldIsDirty() has a SELECT-only
          // branch (defaultSelected ?? first option) that an all-<input> open line
          // can never reach (M1 Task 7 fix 4), and M2's perColumnMin measures the
          // widest widget in a column. defaultSelected is the `selected`
          // ATTRIBUTE, so an untouched select reads pristine, not dirty.
          const select = document.createElement("select");
          select.id = "units_display";
          select.name = "units_display";
          for (const value of String(line.unitslist).split(ENQ)) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value === line.units && line.units_display
              ? line.units_display
              : `Unit ${value}`;
            option.defaultSelected = value === line.units;
            select.append(option);
          }
          return select;
        }

        function widgetFor(line, column) {
          if (column.id === "item") {
            return itemWidget(line);
          }
          if (column.id === "units") {
            return unitsWidget(line);
          }
          // Gate A recorded the quantity widget's id verbatim: quantity_formattedValue
          // — no machine prefix, no line digit (probe-transcripts.md:60).
          return textInput(`${column.id}_formattedValue`, renderText(line, column));
        }

        function rowCells(row, line, focused) {
          for (const column of COLUMNS) {
            if (focused && materialized.has(column.id)) {
              // ONE cell's text is replaced by ONE widget. Its siblings stay
              // text: opening a line does not materialize the row (probe 7 —
              // only the item field materialized; probe 11 — the widget for a
              // never-clicked cell simply never exists).
              const td = document.createElement("td");
              td.append(widgetFor(line, column));
              row.append(td);
            } else {
              row.append(textCell(renderText(line, column)));
            }
          }
        }

        function headerRow() {
          // Bare text, no ids, no data-field-name (probe 4, probe 6c). Whether
          // NetSuite wraps the text in div.listheader was NEVER probed, so the
          // fixture does not assume the wrapper — assuming it here would repeat
          // the exact M1 sin. The wrapped variant is covered in the unit stub
          // (tests/edit-grid.test.mjs, wrappedHeaders), where being wrong is free.
          const row = document.createElement("tr");
          row.className = "uir-machine-headerrow";
          for (const column of COLUMNS) {
            row.append(textCell(column.label));
          }
          return row;
        }

        function dataRow(line, number) {
          const row = document.createElement("tr");
          row.id = `item_row_${number}`;
          const parity = number % 2 === 1 ? "uir-machine-row-odd" : "uir-machine-row-even";
          row.className = focusedLine === number
            // Probe 7: the opened line KEEPS its id and gains both classes.
            ? `uir-machine-row ${parity} uir-machine-row-focused listfocusedrow`
            : `uir-machine-row ${parity}`;
          rowCells(row, line, focusedLine === number);
          return row;
        }

        function entryRow() {
          // Probe 3: id-less, permanently present, permanently focused, full
          // width. It is the reason isLineOpen() may not simply ask "is any row
          // focused" — that question is true for the entire session (Task 2).
          const row = document.createElement("tr");
          row.className = "uir-machine-row uir-machine-row-even listtextnonedit uir-machine-row-focused";
          rowCells(row, BLANK_LINE, focusedLine === null);
          return row;
        }

        function buttonRow() {
          // Probe 3 / probe 7: class uir-machine-button-row (the OLD spec name
          // machineButtonRow does not exist on this machine), always attached,
          // and it RELOCATES to sit directly beneath whichever line is open.
          const row = document.createElement("tr");
          row.className = "uir-machine-button-row";
          const cell = document.createElement("td");
          cell.colSpan = COLUMNS.length;
          for (const [id, label] of [
            ["item_addedit", "OK"],
            ["item_clear", "Cancel"],
            ["item_copy", "Make Copy"],
            ["item_insert", "Insert"],
            ["item_remove", "Remove"]
          ]) {
            const button = document.createElement("input");
            // type="button" always: this lives inside the machine's mini-form,
            // and a bare <input> in a form submits it.
            button.type = "button";
            button.id = id;
            button.name = id;
            button.value = label;
            cell.append(button);
          }
          row.append(cell);
          return row;
        }

        function lastRow() {
          // Probe 3 recorded this class on the live machine and NEITHER the spec
          // nor netsuite.css names it; core's EXCLUDED_ROW_SELECTOR carries it.
          const row = document.createElement("tr");
          row.className = "uir-machine-row-last";
          const cell = document.createElement("td");
          cell.colSpan = COLUMNS.length;
          row.append(cell);
          return row;
        }

        function writeMachineFieldInputs() {
          // Regenerated with the rows, every time. A stale itemdata would leave
          // the axis resting on lines the machine no longer renders, and
          // parseMachineFieldData would refuse the moment the counts disagreed.
          const fields = FIELDS.join(SOH);
          const data = lines
            .map((line) => FIELDS.map((field) => String(line[field] ?? "")).join(SOH))
            .join(STX);
          fieldsInput.value = fields;
          fieldsInput.defaultValue = fields;
          dataInput.value = data;
          dataInput.defaultValue = data;
        }

        function buildTable() {
          // buildtable(): probe 7 observed that opening a single line replaces
          // EVERY row object, header included. Nothing SuiteMate writes into a
          // row survives this, which is why identity is re-derived per install
          // and never read back off a <td> stamp.
          const body = document.createElement("tbody");
          body.append(headerRow());
          lines.forEach((line, index) => {
            const number = index + 1;
            body.append(dataRow(line, number));
            if (focusedLine === number) {
              body.append(buttonRow());
            }
          });
          body.append(entryRow());
          if (focusedLine === null) {
            body.append(buttonRow());
          }
          body.append(lastRow());
          // No totals row: the live machine has none (probe 3).
          table.replaceChild(body, table.tBodies[0]);
          writeMachineFieldInputs();
        }

        // The scope key src/edit-grid/runtime.js resolveScopeKey() derives on this
        // page, spelled out rather than recomputed so the fixture never disagrees
        // with itself: `${companyId}:${userId}:${type}:edit`, where companyId and
        // userId come from the session_status_init.jsp params in <head>
        // (companyId=FIXTURE, id=FIXTURE~1~3~N -> segment 2 is the user id) and
        // type comes from this page's own replaceState path (salesord.nl).
        // If resolveScopeKey ever changes, this literal must change with it.
        const SCOPE_KEY = "FIXTURE:1:salesord:edit";

        globalThis.SuiteMateV3EditFixture = {
          get lines() {
            return lines;
          },
          get scopeKey() {
            return SCOPE_KEY;
          },
          // The axis this machine's own field data and header labels must yield.
          get columnIds() {
            return COLUMNS.map((column) => column.id);
          },
          get labels() {
            return COLUMNS.map((column) => column.label);
          },
          openLine(number, columnId = "item") {
            // Live: a line opens because a CELL was clicked, and only that cell's
            // widget materializes.
            focusedLine = number;
            materialized = new Set([columnId]);
            buildTable();
          },
          clickCell(columnId) {
            // A second click inside the row that already holds the focus:
            // Gate A step (c) clicked the Quantity cell of the open line and
            // quantity_formattedValue appeared beside the still-text siblings.
            materialized.add(columnId);
            buildTable();
          },
          closeLine() {
            focusedLine = null;
            materialized = new Set(["item"]);
            buildTable();
          },
          addLine() {
            const record = RECORDS[lines.length % RECORDS.length];
            lines = [...lines, makeLine(record)];
            buildTable();
          },
          insertLine(number) {
            // Probe 10: Insert makes the new line item_row_{number}, shifts every
            // later line down, and leaves the new line OPEN with its item widget
            // materialized. Ids come from position, so the renumbering falls out
            // of the rebuild exactly as it does live.
            const record = RECORDS[lines.length % RECORDS.length];
            const index = Math.min(Math.max(number - 1, 0), lines.length);
            lines = [...lines.slice(0, index), makeLine(record), ...lines.slice(index)];
            focusedLine = index + 1;
            materialized = new Set(["item"]);
            buildTable();
          },
          removeLine(number) {
            lines = lines.filter((_, index) => index + 1 !== number);
            if (focusedLine === number) {
              focusedLine = null;
              materialized = new Set(["item"]);
            }
            buildTable();
          },
          repaint: buildTable,
          // NOT machine emulation: a test affordance that reproduces what Gate A
          // step (b) did by hand — insertBefore on live <td>s — so the axis-pinning
          // proof has a permuted rendering to install against. It moves the cells
          // in place instead of rebuilding, because a rebuild would restore native
          // order before the runtime ever saw the permutation. Calling it twice
          // returns the machine to native order.
          permuteColumns(first, second) {
            for (const row of table.rows) {
              const cells = Array.from(row.cells);
              if (cells.length !== COLUMNS.length) {
                continue;
              }
              const [low, high] = first < second ? [first, second] : [second, first];
              const after = cells[high].nextSibling;
              row.insertBefore(cells[high], cells[low]);
              row.insertBefore(cells[low], after);
            }
          },
          // Seeding costs a write: chrome-stub.js set() bumps
          // dataset.editGridWrites on every suiteMateV3EditColumns write, so a
          // seed left uncounted turns "seeded storage + reload = zero writes"
          // into "one write", and a seed counted-then-forgotten turns it into a
          // false green. This DISCOUNTS ONLY ITS OWN WRITE — it restores the
          // counter's prior value rather than zeroing it, so a write that
          // happened before the seed still shows. Zeroing would erase that
          // evidence and make load -> seed -> repaint -> assert-0 pass even when
          // load wrote; restoring keeps that pattern able to fail.
          //
          // Fresh containers, never a mutated one: chrome-stub.js hands
          // onChanged listeners the stored object BY REFERENCE (no clone), so a
          // seed that mutated a previously stored container would let the
          // runtime observe a change it was never notified of — and a one-write
          // test would pass without the write. JSON round-trip guarantees the
          // seeded entry shares no object identity with the caller's argument.
          //
          // M1.5 seeds nothing: applyAll() is a no-op and no writer is called, so
          // this exists for M2+ (widths), M3 (hidden) and M4 (order). The M1.5
          // round-trip asserts the counter never leaves 0 without seeding at all.
          async seed(entry, scopeKey = SCOPE_KEY) {
            const before = document.documentElement.dataset.editGridWrites;
            await chrome.storage.sync.set({
              [SuiteMateV3EditGridCore.STORAGE_KEY]: {
                schemaVersion: SuiteMateV3EditGridCore.STORAGE_SCHEMA_VERSION,
                grids: { [scopeKey]: JSON.parse(JSON.stringify(entry)) }
              }
            });
            // Restore, never zero. `undefined` before the seed means no write
            // had happened, so the attribute goes back to absent — not to "0",
            // which would be indistinguishable from a counter that was reset.
            if (before === undefined) {
              delete document.documentElement.dataset.editGridWrites;
            } else {
              document.documentElement.dataset.editGridWrites = before;
            }
          }
        };
        buildTable();
      })();
      // STILL UNCOVERED, deliberately: the runtime's post-await
      // `!table.isConnected` guard (src/edit-grid/runtime.js:287). repaint()
      // swaps the <tbody> via replaceChild, which leaves the <table> itself
      // connected, so no sequence of the methods above can make that clause
      // true. Reaching it needs the <table> detached in the window between
      // installEditGrid()'s `await chrome.storage.sync.get` and its resumption —
